name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write # required for npm Trusted Publishing (OIDC) — no NPM_TOKEN needed

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      # Trusted Publishing requires npm CLI >= 11.5.1; the version bundled with setup-node's
      # Node isn't guaranteed to be new enough, so force an upgrade.
      - run: npm install -g npm@latest

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test

      - name: Build npm package (Node-targeted JS)
        run: bun run build

      - name: Publish to npm
        run: npm publish --access public

      - name: Build standalone executables (for GitHub Release assets)
        run: |
          rm -rf dist
          bun run build:binary:all

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* \
            --title "${{ github.ref_name }}" \
            --generate-notes
